server:
  port: 80

spring:
  main:
    banner-mode: off
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${RDS_ENDPOINT}:5432/restaurant
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false

auro-dining:
  path: /app/images


email:
  provider: ses
  from: zqixhy@gmail.com

aws:
  region: ${AWS_REGION:us-east-1}

logging:
  level:
    root: INFO
    com.qiao: INFO
  file:
    name: /home/ec2-user/auro-dining/logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

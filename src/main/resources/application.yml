server:
  port: 80
spring:
  main:
    banner-mode: off
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/restaurant
    username: postgres
    password: '7070'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  cache:
    redis:
      time-to-live: 1800000ms
      cache-null-values: true

auro-dining:
  path: ${user.home}/Pictures/auro_dining_images/

email:
  provider: log
  fixed-code: 1234
  from: zqixhy@gmail.com

